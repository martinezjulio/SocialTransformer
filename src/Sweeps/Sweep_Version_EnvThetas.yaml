program: src/train.py
method: bayes
project: social-belief-modeling
entity: juliomartinez-individual
metric:
  name: val/loss
  goal: minimize

parameters:
  # Fixed parameters
  dataset_name:
    value: "demonstrations_data_00"
  epochs:
    value: 500
  device:
    value: "cuda"
  # LR Scheduler warmup parameters
  warmup_epochs:
    value: 2
  min_lr:
    value: 1e-8
  # Hyperparameters to optimize
  optimizer:
    values: ["adamw"] #["adam", "adamw", "sgd"]
  lr:
    values: [0.00001, 0.00005, 0.0001]
  weight_decay:
    values: [0.0, 0.001, 0.01, 0.1]
  batch_size:
    values: [128]
  dropout:
    values: [0.2]
  num_layers:
    values: [4, 8]
  dim_feedforward:
    values: [1024]
  # d_model and nhead - using distribution to enforce constraint
  d_model:
    values: [256, 512]
  nhead:
    values: [4, 8]
  env_theta_loss:
    values: ["bce"] # ["bce", "beta_nll"]
  demo_loss_weight:
    values: [1.0]
  demo_belief_loss:
    values: ["cross_entropy"] #["log_mse", "kl_divergence", "expected_value_mse", "cross_entropy"]
  experience_loss_weight:
    values: [1.0]
  masking_strategy:
    values: ["all_bandits"] # ["all_bandits", "current_bandit_only"]
  model_type:
    value: "social" # ["social", "social_profile_learned", "social_profile_agent_pooling", "social_profile_cross_attention"]
  experience_head_loss_weight:
    values: [0.0]
  experience_head_loss_type:
    values: ["bce"] # ["mse", "bce"]
  expert_threshold:
    values: [30.0]
  # Head input configurations (Phase 3)
  theta_head_input:
    values: ["query_only"] # ["query_only", "query_and_profiles"]
  demo_beliefs_head_input:
    values: ["query_only"] # ["query_only", "profiles_only", "query_and_profiles"]
  experience_head_input:
    values: ["query_only"] # ["query_only", "profiles_only", "query_and_profiles"]
  # Scheduler parameters
  scheduler :
    value: "plateau" # ["cosine", "plateau"]
  patience:
    value: 15
  factor:
    value: 0.7
  # Overfitting-based early stopping
  overfitting_threshold:
    values: [15.0]  # 0 = disabled, sweep different thresholds
  overfitting_patience:
    values: [50]  # Permissive for 500 epochs, robust to double descent
  overfitting_window:
    value: 15  # 15-epoch moving average

# Custom command to properly pass flags.
# Launch each sweep trial under torchrun so the training script runs as a DDP
# group. nproc_per_node is hardcoded (can't be sweep-parameterized via
# ${args}). Per-rank batch_size means effective batch = batch_size * nproc.
command:
  - ${env}
  - torchrun
  - --standalone
  - --nproc_per_node=2
  - ${program}
  - ${args}
  - --use_wandb
  - --use_scheduler